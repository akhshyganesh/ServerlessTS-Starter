service: lambda-ts-service

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 10
  environment:
    NODE_OPTIONS: '--enable-source-maps'
    STAGE: ${self:provider.stage}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

plugins:
  - serverless-webpack
  - serverless-offline
  - serverless-dotenv-plugin
  - serverless-iam-roles-per-function

custom:
  webpack:
    webpackConfig: 'webpack.config.ts'
    includeModules: true
    packager: 'npm'
    excludeFiles: src/**/*.test.ts
  
# Import function definitions via the JavaScript bridge file
functions: ${file(serverless-functions.js)}

package:
  individually: true
